name: Android app

on:
  push:
    paths: ['app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the built APKs to releases/ on this branch
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # With the AMOUR_FIREBASE_CONFIG secret (contents of
      # app/config/firebase.json) the APK talks to your Firebase project;
      # without it the APK runs the built-in demo.
      - name: Firebase settings
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.AMOUR_FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_CONFIG_JSON" > config/firebase.json
            echo "DART_DEFINES=--dart-define-from-file=config/firebase.json" >> "$GITHUB_ENV"
            echo "Building against Firebase"
          else
            echo "No AMOUR_FIREBASE_CONFIG secret: building the demo"
          fi

      - name: Build release APKs (universal + per CPU architecture)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          out=build/app/outputs/flutter-apk
          mkdir -p ../dist
          flutter build apk --release $DART_DEFINES
          cp "$out/app-release.apk" "../dist/amour-partage-$version.apk"
          flutter build apk --release --split-per-abi $DART_DEFINES
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "../dist/amour-partage-$version-$abi.apk"
          done
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: amour-partage-apks
          path: dist/*.apk
          if-no-files-found: error

      # Manual runs (Actions → Android app → Run workflow) also commit APKs to
      # releases/: the per-CPU builds for phones, plus the universal one when it
      # fits under GitHub's file size limit.
      - name: Publish APKs to releases/
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: .
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git rm -q --ignore-unmatch 'releases/*.apk'
          mkdir -p releases
          cp "dist/amour-partage-$version-arm64-v8a.apk" "dist/amour-partage-$version-armeabi-v7a.apk" releases/
          universal="dist/amour-partage-$version.apk"
          if [ "$(stat -c %s "$universal")" -lt 95000000 ]; then cp "$universal" releases/; fi
          ls -l releases
          git add releases
          if git diff --cached --quiet; then echo "APKs unchanged"; exit 0; fi
          git commit -q -m "Build Android APKs $version (${GITHUB_SHA::7})"
          git pull -q --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
