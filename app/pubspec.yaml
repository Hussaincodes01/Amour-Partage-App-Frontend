name: amour_partage
description: "Amour Partagé — a private space for couples."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  cryptography: ^2.9.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_database: ^13.0.1
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  livekit_client: ^2.13.1
  local_auth: ^3.0.2
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/demo/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Cousine
      fonts:
        - asset: assets/fonts/Cousine-Bold.ttf
          weight: 700
